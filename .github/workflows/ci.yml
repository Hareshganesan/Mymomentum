name: Momentum CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Restore NuGet Packages
      run: dotnet restore Momentum.sln

    - name: Build Solution in Release Mode
      run: dotnet build Momentum.sln -c Release --no-restore

    - name: Run Integration Tests
      run: dotnet run --project src/Momentum.Tests/Momentum.Tests.csproj -c Release --no-restore
